name: P2 Full Notebook Temporary

on:
  push:
    branches:
      - p2-reimplementation
    paths:
      - '.github/workflows/p2-full-notebook-temporary.yml'
  workflow_dispatch:

jobs:
  run-p2-notebook:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
    steps:
      - name: Checkout p2-reimplementation
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: code/modeling/requirements_colab_p2_reimplementation.txt

      - name: Install notebook executor
        run: |
          python -m pip install --upgrade pip
          python -m pip install nbconvert ipykernel jupyter-core

      - name: Execute P2 notebook end to end
        run: |
          python -m jupyter nbconvert \
            --to notebook \
            --execute code/modeling/P2_Reimplementation_Colab.ipynb \
            --output P2_Reimplementation_Colab.executed.ipynb \
            --output-dir code/modeling \
            --ExecutePreprocessor.timeout=-1 \
            --ExecutePreprocessor.kernel_name=python3

      - name: Show completion checklist
        if: always()
        run: |
          if [ -f code/modeling/outputs/p2_reimplementation_full/p2_completion_checklist.json ]; then
            cat code/modeling/outputs/p2_reimplementation_full/p2_completion_checklist.json
          else
            echo 'Full completion checklist was not produced.'
          fi

      - name: Upload executed notebook and P2 outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p2-full-notebook-and-outputs
          if-no-files-found: warn
          retention-days: 7
          path: |
            code/modeling/P2_Reimplementation_Colab.executed.ipynb
            code/modeling/outputs/p2_reimplementation_full/
