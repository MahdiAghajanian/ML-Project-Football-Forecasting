name: P2 Full Notebook Temporary

on:
  push:
    branches:
      - p2-reimplementation
    paths:
      - '.github/workflows/p2-full-notebook-temporary.yml'
  workflow_dispatch:

concurrency:
  group: p2-full-notebook-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run-p2-notebook:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write
    steps:
      - name: Checkout p2-reimplementation
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: code/modeling/requirements_colab_p2_reimplementation.txt

      - name: Install notebook executor
        run: |
          python -m pip install --upgrade pip
          python -m pip install nbconvert ipykernel jupyter-core

      - name: Execute P2 notebook end to end
        id: notebook
        continue-on-error: true
        run: |
          # nbconvert executes relative to the input notebook directory. Copy the
          # notebook to the repository root so its PROJECT_ROOT discovery sees
          # the checked-out data tree exactly as it does in the documented flow.
          cp code/modeling/P2_Reimplementation_Colab.ipynb ./P2_Reimplementation_Colab.ipynb
          python -m jupyter nbconvert \
            --to notebook \
            --execute P2_Reimplementation_Colab.ipynb \
            --output P2_Reimplementation_Colab.executed.ipynb \
            --output-dir code/modeling \
            --ExecutePreprocessor.timeout=-1 \
            --ExecutePreprocessor.kernel_name=python3

      - name: Show completion checklist
        if: always()
        run: |
          if [ -f code/modeling/outputs/p2_reimplementation_full/p2_completion_checklist.json ]; then
            cat code/modeling/outputs/p2_reimplementation_full/p2_completion_checklist.json
          else
            echo 'Full completion checklist was not produced.'
          fi

      - name: Upload executed notebook and P2 outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p2-full-notebook-and-outputs
          if-no-files-found: warn
          retention-days: 7
          path: |
            code/modeling/P2_Reimplementation_Colab.executed.ipynb
            code/modeling/outputs/p2_reimplementation_full/

      - name: Record run status on branch
        if: always()
        env:
          NOTEBOOK_OUTCOME: ${{ steps.notebook.outcome }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          START_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p = Path('code/modeling/P2_ACTION_STATUS.json')
          payload = {
              'workflow': 'P2 Full Notebook Temporary',
              'run_id': int(os.environ['RUN_ID']),
              'run_attempt': int(os.environ['RUN_ATTEMPT']),
              'start_sha': os.environ['START_SHA'],
              'notebook_outcome': os.environ['NOTEBOOK_OUTCOME'],
              'full_output_exists': Path('code/modeling/outputs/p2_reimplementation_full').is_dir(),
              'completion_checklist_exists': Path('code/modeling/outputs/p2_reimplementation_full/p2_completion_checklist.json').is_file(),
              'artifact_name': 'p2-full-notebook-and-outputs',
          }
          p.write_text(json.dumps(payload, indent=2) + '\n', encoding='utf-8')
          print(p.read_text())
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add code/modeling/P2_ACTION_STATUS.json
          git commit -m 'Record P2 notebook run status [skip ci]' || true
          git push origin HEAD:p2-reimplementation

      - name: Fail workflow if notebook failed
        if: steps.notebook.outcome != 'success'
        run: exit 1
